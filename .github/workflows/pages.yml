name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push the Vite build to the gh-pages branch. GitHub's default "pages build
# and deployment" job publishes the source tree from main, which leaves the
# site as a blank dark page because the browser never gets the bundled JS.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /Consensus/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
